<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>График поставок — Главная</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
</head>
<body class="home-page">
  <canvas id="icover-snow"></canvas>
  <main class="home-hero centered">
    <div class="glass-card hero-card auth-card">
      <img
        src="{{ url_for('static', filename='logo-icover.svg') }}"
        alt="iCover"
        class="hero-logo"
      />
      <h1>График поставок</h1>
      <p>
        Планируйте поставки, выбирайте даты в календаре и подтверждайте прием на складе —
        все в одном современном интерфейсе.
      </p>
      <div class="hero-actions">
        <a class="primary-btn" href="{{ url_for('login') }}">Войти</a>
      </div>
    </div>
  </main>

  <script src="{{ url_for('static', filename='icover-snow.js') }}"></script>
</body>
</html>
