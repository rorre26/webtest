<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gallery Walk</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div class="brand">
          <span class="brand__title">Gallery Walk</span>
          <span class="brand__subtitle">2D виртуальная галерея</span>
        </div>
        <nav class="topbar__nav">
          <button id="startGallery" class="ghost-button">Перейти в галерею</button>
        </nav>
      </header>

      <main id="main" class="main"></main>

      <aside class="cta">
        <div class="cta__content">
          <span>Записаться на съемку</span>
          <div class="cta__links">
            <a class="cta__link" href="https://t.me/" target="_blank" rel="noreferrer">Telegram</a>
            <a class="cta__link" href="mailto:hello@example.com">Email</a>
          </div>
        </div>
      </aside>

      <div id="seriesModal" class="modal" aria-hidden="true">
        <div class="modal__backdrop"></div>
        <div class="modal__content" role="dialog" aria-modal="true">
          <button id="closeSeries" class="modal__close" aria-label="Закрыть">✕</button>
          <div class="modal__header">
            <h2 id="seriesTitle"></h2>
            <p id="seriesDescription"></p>
          </div>
          <div class="modal__viewer">
            <button id="prevSlide" class="viewer__nav">◀</button>
            <div class="viewer__frame">
              <img id="seriesImage" alt="" />
            </div>
            <button id="nextSlide" class="viewer__nav">▶</button>
          </div>
          <div class="modal__footer">
            <button id="backToGallery" class="primary">Назад в галерею</button>
            <a class="primary" href="https://t.me/" target="_blank" rel="noreferrer">Записаться</a>
          </div>
        </div>
      </div>
    </div>

    <script src="app.js" type="module"></script>
  </body>
</html>
